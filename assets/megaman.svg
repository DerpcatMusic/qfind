  <path d="M268 374L304 392L344 372L308 354Z" fill="#456663"/>
  <path d="M304 392L344 372V424L304 444Z" fill="#172C30"/>
  <!-- The folder-tab crown belongs to the body, rather than sitting on it. -->
  <path d="M112 130H208L240 162H336V386H112Z" fill="#83BBA8"/>
