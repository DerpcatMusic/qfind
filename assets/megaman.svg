<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Bit — Megaman’s voxel file keeper</title>
  <desc id="desc">Bit, a compact mint-green voxel robot with a dark visor, two square eyes, and an amber folder tucked into its body. Crisp three-quarter geometry and a single raised folder tab give it a playful silhouette.</desc>
