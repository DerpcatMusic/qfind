[workspace]
members = ["crates/core", "crates/cli", "crates/tui", "crates/gtk", "crates/native"]
# CLI/TUI only. `cargo build -p qfind-gtk` or `--workspace` pulls gtk4.
default-members = ["crates/core", "crates/cli", "crates/tui"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"
rust-version = "1.92"
publish = false

[workspace.dependencies]
qfind-core = { path = "crates/core" }
anyhow = "1"
async-channel = "2.5"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
compress-tools = "0.16.1"
crossterm = "0.29"
dirs = "6"
globset = "0.4"
ignore = "0.4"
gtk = { version = "0.11", package = "gtk4", features = ["v4_12"] }
image = { version = "0.25.6", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
memmap2 = "0.9"
nucleo-matcher = "0.3"
# Real media Preview: pure-Rust decode for the waveform, in-process output so
# seeking is sample-accurate instead of a kill-and-respawn.
symphonia = { version = "0.5", default-features = false, features = [
  "pcm",
  "adpcm",
  "flac",
  "mp3",
  "vorbis",
  "aiff",
  "wav",
  "ogg",
] }
cpal = "0.16"
# Video needs a real transport, and `playbin` is the one pipeline that decodes
# "whatever the file is". Frames arrive through an appsink as RGB.
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
ratatui = "0.30"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
rayon = "1"
rustix = { version = "1", features = ["fs"] }
simple-archive = "0.4"
tempfile = "3"
thiserror = "2"
zbus = "5.19"

[patch.crates-io]
crossterm = { path = "vendor/crossterm" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
