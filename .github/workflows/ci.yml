name: CI
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel in the merge queue: a cancelled entry blocks the merge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # Linux system libraries this crate links against (space separated). Edit per repo.
  # gtk4 crate feature v4_12 needs GTK >= 4.12 (24.04 ships 4.14).
  APT_PACKAGES: "libgtk-4-dev libarchive-dev xvfb"
jobs:
  lint:
    name: fmt + clippy + doc
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.9.2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: env.APT_PACKAGES != ''
        run: sudo apt-get update && sudo apt-get install -y $APT_PACKAGES
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo doc --workspace --no-deps

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # compress-tools links libarchive; the macOS/Windows shells are native apps built elsewhere.
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.9.2
        with:
          shared-key: test-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: runner.os == 'Linux' && env.APT_PACKAGES != ''
        run: sudo apt-get update && sudo apt-get install -y $APT_PACKAGES
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: nextest
      - run: xvfb-run -a cargo nextest run --workspace --all-features --no-tests=pass
      - run: cargo test --workspace --all-features --doc

  # Builds with the oldest compiler declared in Cargo.toml `rust-version`. Skips when none is declared.
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: v
        run: echo "msrv=$(cargo metadata --no-deps --format-version 1 | jq -r '[.packages[].rust_version | select(. != null)] | min // empty')" >> "$GITHUB_OUTPUT"
      - if: steps.v.outputs.msrv != ''
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ steps.v.outputs.msrv }}
      - if: steps.v.outputs.msrv != ''
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.9.2
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.v.outputs.msrv != '' && env.APT_PACKAGES != ''
        run: sudo apt-get update && sudo apt-get install -y $APT_PACKAGES
      - if: steps.v.outputs.msrv != ''
        run: cargo check --workspace --all-targets --all-features

  # Advisories, licenses, duplicate/banned crates. Configure in deny.toml.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check advisories bans licenses sources

  # The ONLY required status check. Every job above must be in `needs`:
  # a skipped job reads as success to GitHub, so the gate must run on !cancelled().
  conclusion:
    if: ${{ !cancelled() }}
    needs: [lint, test, msrv, deny]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: jq --exit-status 'all(.result == "success" or .result == "skipped")' <<< '${{ toJson(needs) }}'
