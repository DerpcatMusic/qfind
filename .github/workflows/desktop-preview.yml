name: Megaman desktop preview

on:
  push:
    tags: ['megaman-v*']
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        default: all
        options: [all, macos, windows]
        description: Native platforms to build
      windows_run:
        type: string
        default: ''
        description: Optional successful Windows run to repackage without rebuilding

permissions:
  contents: read
  actions: read

jobs:
  macos:
    if: github.event_name == 'push' || inputs.platform != 'windows'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Use current stable Rust
        run: rustup update stable --no-self-update
      - name: Install archive dependencies
        run: brew install libarchive pkg-config
      - name: Build native test app
        env:
          MEGAMAN_PREVIEW: '1'
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix libarchive)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          ./packaging/release-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: megaman-${{ matrix.runner }}
          path: target/dist/*macos*.zip*
          if-no-files-found: error

  windows:
    if: github.event_name == 'push' || inputs.platform != 'macos'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use current stable Rust
        run: rustup update stable --no-self-update
      - name: Download existing Windows build
        if: inputs.windows_run != ''
        uses: actions/download-artifact@v5
        with:
          name: megaman-windows-x64
          path: target/prebuilt
          run-id: ${{ inputs.windows_run }}
          github-token: ${{ github.token }}
      - name: Build native test app
        shell: pwsh
        env:
          MEGAMAN_REUSE_WINDOWS_RUN: ${{ inputs.windows_run }}
        run: |
          if ($env:MEGAMAN_REUSE_WINDOWS_RUN) {
            $archive = Get-ChildItem target/prebuilt -Filter '*.zip' | Select-Object -First 1
            $expected = (Get-Content "$($archive.FullName).sha256").Split(' ')[0]
            if ((Get-FileHash $archive.FullName -Algorithm SHA256).Hash -ne $expected) { throw 'Downloaded archive checksum mismatch' }
            $env:MEGAMAN_PUBLISHED_ZIP = $archive.FullName
          }
          ./packaging/release-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: megaman-windows-x64
          path: target/dist/*windows*.zip*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/megaman-v')
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
      - name: Publish test downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'
          Megaman native desktop preview: shared Rust components, separate Storage and Projects workspaces, Git changes and footer status, build/package tasks, batch file operations, archives, and measured folder sizes.

          Windows: extract the entire ZIP and launch Qfind.Windows.exe. Keep its DLLs together.
          macOS: choose arm64 for Apple Silicon or x86_64 for Intel, extract and move Qfind.app to Applications. Requires macOS 14+. These test apps are ad-hoc signed, not notarized; macOS may require Privacy & Security → Open Anyway.

          This is a testing prerelease. Native builds are checked by CI; interactive platform acceptance remains pending. SHA-256 files accompany the downloads.
          NOTES
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --title "Megaman 0.4.0 Preview" --notes-file notes.md
          mapfile -d '' assets < <(find dist -type f -print0)
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}"
